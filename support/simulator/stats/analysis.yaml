---
# ============================== Agent Counters ============================== #
    - type: static
      counter: GC_THREAD_COUNT
      title: gc-thread-count
    - type: static
      counter: GC_PHASE_COUNT
      title: gc-phase-count
    - type: resource_usage
      counter: GC_CPU_PERCENT
      title: gc-cpu-percent
    - type: overhead
      counters:
          - time
      title: t_o
    - type: count
      counters:
          - time
      title: t_c
    - type: p99
      counter: time
      title: t_99
    - type: mean
      counter: time
      title: t_m
# ============================= Instruction Count ============================ #
    - type: overhead
      counters:
          - insts
      title: i_o
    - type: count
      counters:
          - total_insts
      title: t_i
    - type: division
      counters:
          denominator: total_cycles
          numerator: total_insts
      title: ipc
# ================================ Load to Use =============================== #
    - type: count
      counters:
          - loadtouse
      title: l2u
